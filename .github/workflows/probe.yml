name: Probe

# Manual diagnostics that need the open internet (the build sandbox can't reach chains).
on:
  workflow_dispatch:
    inputs:
      task:
        description: "canaries"
        default: canaries

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Find canary coins
        if: inputs.task == 'canaries'
        run: node scripts/find-canaries.mjs 400 60
      - name: Capture live API answers for the demo video
        if: inputs.task == 'demo'
        run: |
          S=https://asylia.vercel.app
          for a in 1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa 34xp4vRoCGJym3xR7yCVPFHoCNxv4Twseo 3M219KR5vEneNb47ewrPfWyb5jQ2DjxRP6 bc1qgdjqv0av3q56jvd82tkdjpy7gdp9ut8tlqmgrpmv24sq90ecnvqqjwvw97 0x28C6c06298d514Db089934071355E5743bf21d60 0xF977814e90dA44bFA03b6295A0616a897441aceC lifeboat-f86cd6e7d4.testnet; do
            echo "SCAN $a"; curl -s -X POST $S/api/scan -H 'content-type: application/json' -d "{\"text\":\"$a\"}"; echo
          done
          echo "KEYS"; curl -s "$S/api/near/keys?account=lifeboat-f86cd6e7d4.testnet"; echo
          echo "WATCH"; curl -s "$S/api/watch/status"; echo
          echo "WATCHM"; curl -s "$S/api/watch/status?network=mainnet"; echo
          echo "SIM"; curl -s "$S/api/watch/status?network=mainnet&simulate=8"; echo
          echo "HOME"; curl -s -o /dev/null -w "%{http_code}\n" $S/
      - name: Print the site fonts for offline preview renders
        if: inputs.task == 'fonts'
        run: |
          css=$(curl -s 'https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,400i,500i&display=swap')
          echo "$css"
          for u in $(echo "$css" | grep -o 'url([^)]*woff2[^)]*)' | sed "s/url(//;s/)//;s/[\"']//g"); do
            case "$u" in //*) u="https:$u";; esac
            echo "FONT $u"; curl -s "$u" | base64 -w0; echo
          done
